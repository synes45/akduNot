<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AkduTip.space</title>
  <meta name="description" content="Akdeniz Üniversitesi Tıp Fakültesi Dönem 1, 2 ve 3 komite ve final not hesaplayıcı.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AkduTip">
  <meta name="theme-color" content="#09090b">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-180.png">
  <script>
    (function() {
      try {
        var raw = JSON.parse(localStorage.getItem('akdeniz_tip_v2') || '{}');
        var isDark = raw.theme === 'dark' || (raw.theme !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = isDark ? '#09090b' : '#f4f4f5';
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
